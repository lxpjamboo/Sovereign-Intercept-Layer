kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "uv run --python 3.12 --project ../.. uvicorn --app-dir python app:app --host 0.0.0.0 --port $PORT"

[services.production.build]
args = ["uv", "sync", "--project", "../.."]

[services.production.run]
args = ["uv", "run", "--project", "../..", "--no-sync", "uvicorn", "--app-dir", "python", "app:app", "--host", "0.0.0.0", "--port", "8080"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"
